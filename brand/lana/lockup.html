<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LANA Wordmark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: 'Manrope', system-ui, sans-serif; }
  .lana-lockup { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 14px; padding: 40px; }
  .lana-lockup.light { background: #F8F6FC; }
  .lana-lockup.dark  { background: #1A0E2E; }
  .lana-word { display: flex; align-items: baseline; font-size: 64px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
  .light .l { color: #7C2FD6; }
  .dark  .l { color: #B98CFF; }
  .light .ana { color: #1E1029; }
  .dark  .ana { color: #F8F6FC; }
  .lana-tagline { font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; }
  .light .lana-tagline { color: #8B7FA0; }
  .dark  .lana-tagline { color: #A296B8; }
</style>
</head>
<body>
  <div class="lana-lockup light">
    <div class="lana-word"><span class="l">L</span><span class="ana">ANA</span></div>
    <div class="lana-tagline">AI Sales Coaching &amp; Scoring</div>
  </div>
  <div class="lana-lockup dark">
    <div class="lana-word"><span class="l">L</span><span class="ana">ANA</span></div>
    <div class="lana-tagline">AI Sales Coaching &amp; Scoring</div>
  </div>
</body>
</html>
